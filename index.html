<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Selected work and personal portfolio of Julie Tran." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <style>
      html[data-landing-boot] { background: #000; }
    </style>
    <script>
      const isLandingEntry = location.pathname === '/' && (!location.hash || location.hash === '#home');

        document.documentElement.setAttribute('data-landing-boot', '');
      }
    </script>
    <title>Julie Tran | Portfolio</title>
  </head>
